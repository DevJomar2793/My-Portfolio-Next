<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">School Booth website preview</title>
  <desc id="desc">The School Booth homepage with a blue camera, colorful photo cards, and the message Capture Good Vibes Together.</desc>
  <defs>
    <linearGradient id="cameraBody" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#258cff"/><stop offset=".52" stop-color="#0868f8"/><stop offset="1" stop-color="#0349bd"/>
    </linearGradient>
    <linearGradient id="cameraSide" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0b316d"/><stop offset="1" stop-color="#061a43"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2c9cff"/><stop offset=".45" stop-color="#0a449e"/><stop offset="1" stop-color="#031b4f"/>
    </linearGradient>
    <linearGradient id="bluePhoto" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a9dcff"/><stop offset="1" stop-color="#72b9f5"/></linearGradient>
    <linearGradient id="pinkPhoto" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc1d7"/><stop offset="1" stop-color="#ff85b1"/></linearGradient>
    <linearGradient id="purplePhoto" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e3dcff"/><stop offset="1" stop-color="#c1b1ff"/></linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#082654" flood-opacity=".18"/></filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#082654" flood-opacity=".16"/></filter>
  </defs>

  <rect width="1440" height="900" fill="#ffffff"/>

  <!-- Header -->
  <g transform="translate(52 17)">
    <rect width="72" height="57" rx="9" fill="#072858" filter="url(#smallShadow)"/>
    <path d="M16 25h11l4-7h12l4 7h10a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V29a4 4 0 0 1 4-4Z" fill="#ffffff"/>
    <circle cx="36" cy="38" r="6" fill="#072858"/>
    <text x="91" y="40" fill="#072858" font-family="Arial Rounded MT Bold, Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="800">SCHOOL BOOTH</text>
  </g>
  <g font-family="Arial Rounded MT Bold, Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="540" y="17" width="112" height="59" rx="30" fill="#dceeff"/>
    <text x="596" y="53" fill="#072858" text-anchor="middle">Home</text>
    <text x="720" y="52" fill="#5f75a8" text-anchor="middle">Gallery</text>
    <text x="845" y="52" fill="#5f75a8" text-anchor="middle">About</text>
  </g>

  <!-- Hero copy -->
  <g transform="translate(54 205)" font-family="Arial Rounded MT Bold, Trebuchet MS, Arial, sans-serif">
    <text x="0" y="16" fill="#6179b0" font-size="14" font-weight="700" letter-spacing="4">SNAP  •  SMILE  •  CREATE MEMORIES</text>
    <text x="0" y="102" fill="#072858" font-size="68" font-weight="900" letter-spacing="-3">Capture</text>
    <text x="0" y="174" fill="#072858" font-size="68" font-weight="900" letter-spacing="-3">Good Vibes</text>
    <text x="0" y="246" fill="#072858" font-size="68" font-weight="900" letter-spacing="-3">Together!</text>
    <text x="0" y="296" fill="#6179a7" font-size="19" font-weight="700">Take photos, create memories,</text>
    <text x="0" y="320" fill="#6179a7" font-size="19" font-weight="700">and make every moment special!</text>
    <rect x="0" y="350" width="476" height="68" rx="15" fill="#0868f8" filter="url(#smallShadow)"/>
    <g transform="translate(48 370)">
      <path d="M3 8h10l3-6h15l3 6h9a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H3a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4Z" fill="#ffffff"/>
      <circle cx="23" cy="24" r="8" fill="#0868f8"/>
    </g>
    <text x="160" y="392" fill="#ffffff" font-size="22" font-weight="800">Start Photo Booth</text>
    <path d="m424 375 10 10-10 10" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Color splashes behind the artwork -->
  <g opacity=".9">
    <ellipse cx="940" cy="232" rx="193" ry="103" fill="#a8d9ff" transform="rotate(8 940 232)"/>
    <ellipse cx="1197" cy="235" rx="151" ry="82" fill="#ffeb75" transform="rotate(-22 1197 235)"/>
    <ellipse cx="777" cy="309" rx="132" ry="91" fill="#ffe36d" transform="rotate(22 777 309)"/>
    <ellipse cx="760" cy="552" rx="139" ry="103" fill="#ff9fc3" transform="rotate(-17 760 552)"/>
    <ellipse cx="1111" cy="499" rx="215" ry="94" fill="#acdfff" transform="rotate(-10 1111 499)"/>
  </g>

  <!-- Polaroid photos -->
  <g filter="url(#softShadow)">
    <g transform="rotate(-14 833 334)">
      <rect x="749" y="195" width="190" height="231" rx="8" fill="#ffffff" stroke="#061c4b" stroke-width="7"/>
      <rect x="770" y="218" width="148" height="156" fill="url(#bluePhoto)"/>
      <circle cx="844" cy="294" r="46" fill="#ffe145" stroke="#061c4b" stroke-width="6"/>
      <ellipse cx="828" cy="283" rx="5" ry="10" fill="#061c4b"/><ellipse cx="861" cy="283" rx="5" ry="10" fill="#061c4b"/>
      <path d="M820 312q24 25 49-1" fill="none" stroke="#061c4b" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g transform="rotate(13 1028 316)">
      <rect x="940" y="174" width="187" height="235" rx="8" fill="#ffffff" stroke="#061c4b" stroke-width="7"/>
      <rect x="960" y="197" width="147" height="160" fill="url(#pinkPhoto)"/>
      <path d="M1033 320c-13-18-42-51-32-78 8-22 38-19 42 5 11-27 43-25 49-3 8 28-37 65-59 76Z" fill="#ff759d" stroke="#f4003c" stroke-width="7" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(16 1185 400)">
      <rect x="1097" y="275" width="181" height="226" rx="8" fill="#ffffff" stroke="#061c4b" stroke-width="7"/>
      <rect x="1118" y="298" width="139" height="149" fill="url(#purplePhoto)"/>
      <path d="m1187 329 14 31 34 4-25 23 7 34-30-17-30 17 7-34-25-23 34-4Z" fill="#ffe13d" stroke="#061c4b" stroke-width="6" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Camera -->
  <g filter="url(#softShadow)">
    <path d="M764 386 893 347l36 22 142 8 51 27 35 202c4 27-11 50-37 55l-309-51c-34-6-55-31-51-62Z" fill="url(#cameraBody)" stroke="#061c4b" stroke-width="8" stroke-linejoin="round"/>
    <path d="m1071 377 51 27 35 202c4 27-11 50-37 55l-50-10Z" fill="url(#cameraSide)" opacity=".95"/>
    <path d="m784 408 138-29 118 19 22 59-289-28Z" fill="#167dff"/>
    <path d="M928 369h80l28 48-139-10Z" fill="#157cf5" stroke="#061c4b" stroke-width="8" stroke-linejoin="round"/>
    <rect x="932" y="382" width="81" height="25" rx="6" fill="#092553" stroke="#061c4b" stroke-width="6" transform="rotate(6 972 394)"/>
    <g transform="rotate(7 808 387)"><ellipse cx="808" cy="386" rx="30" ry="20" fill="#071b46" stroke="#061c4b" stroke-width="6"/><rect x="785" y="370" width="46" height="18" rx="8" fill="#163d73"/></g>
    <g transform="rotate(8 1089 415)"><ellipse cx="1089" cy="415" rx="34" ry="21" fill="#071b46" stroke="#061c4b" stroke-width="6"/><rect x="1063" y="398" width="52" height="19" rx="8" fill="#163d73"/></g>
    <path d="M776 465h55v132l-50-8c-15-3-24-15-22-30Z" fill="#ffffff" opacity=".88"/>
    <rect x="1021" y="456" width="90" height="58" rx="10" fill="#ffffff" transform="rotate(8 1066 485)"/>
    <text x="1067" y="493" fill="#061c4b" font-family="Comic Sans MS, Trebuchet MS, sans-serif" font-size="29" font-weight="900" text-anchor="middle" transform="rotate(8 1067 493)">Smile!</text>
    <circle cx="910" cy="522" r="112" fill="#ffffff" stroke="#061c4b" stroke-width="8"/>
    <circle cx="910" cy="522" r="88" fill="#d9e6f4" stroke="#061c4b" stroke-width="7"/>
    <circle cx="910" cy="522" r="68" fill="#071b46"/><circle cx="910" cy="522" r="49" fill="url(#lens)" stroke="#020d2e" stroke-width="6"/>
    <circle cx="894" cy="505" r="14" fill="#b5dcff" opacity=".95"/><circle cx="918" cy="523" r="7" fill="#dceeff" opacity=".9"/>
    <path d="m1056 542 13 29 32 4-24 21 7 32-28-16-28 16 7-32-24-21 32-4Z" fill="#ffe13d" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    <path d="m1056 542 13 29 32 4-24 21 7 32-28-16-28 16 7-32-24-21 32-4Z" fill="#ffe13d" stroke="#ffb400" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Decorative marks and caption -->
  <g fill="none" stroke="#ffb400" stroke-width="11" stroke-linecap="round"><path d="m675 328 32 38"/><path d="m719 307 13 48"/><path d="m652 391 44 14"/></g>
  <g fill="none" stroke="#061c4b" stroke-width="10" stroke-linecap="round"><path d="m1182 225 18-37"/><path d="m1214 254 31-26"/><path d="m1285 459 17-44"/><path d="m1311 480 33-31"/></g>
  <g transform="rotate(-12 1270 583)" font-family="Comic Sans MS, Trebuchet MS, sans-serif" font-weight="900" fill="#061c4b" text-anchor="middle">
    <text x="1270" y="544" font-size="40">Click.</text><text x="1270" y="586" font-size="40">Smile.</text><text x="1270" y="628" font-size="40">Repeat!</text>
    <path d="M1206 645h128" stroke="#ff456c" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Wavy feature footer -->
  <path d="M0 707c138 52 262 21 407 20 154-1 184 34 348 8 174-27 280 31 438 6 98-15 169-17 247-37v196H0Z" fill="#dceeff"/>
  <g transform="translate(48 790)" font-family="Arial Rounded MT Bold, Trebuchet MS, Arial, sans-serif">
    <g>
      <circle cx="35" cy="35" r="35" fill="#c7e1ff"/><path d="M17 29h9l4-6h12l4 6h9a4 4 0 0 1 4 4v20H13V33a4 4 0 0 1 4-4Z" fill="#072858"/><circle cx="36" cy="42" r="7" fill="#dceeff"/>
      <text x="98" y="22" fill="#072858" font-size="16" font-weight="800">Take Photos</text><text x="98" y="49" fill="#5874ad" font-size="14" font-weight="700">Choose your favorite layout</text><text x="98" y="69" fill="#5874ad" font-size="14" font-weight="700">and strike a pose!</text>
    </g>
    <path d="M415 0v77" stroke="#b5d5f4"/>
    <g transform="translate(454)">
      <circle cx="35" cy="35" r="35" fill="#c7e1ff"/><path d="m24 50 24-24 7 7-24 24-10 3Z" fill="none" stroke="#072858" stroke-width="3" stroke-linejoin="round"/><path d="m48 17 2-7m7 12 7-2m-19 0-5-5" stroke="#072858" stroke-width="3" stroke-linecap="round"/>
      <text x="98" y="22" fill="#072858" font-size="16" font-weight="800">Make It Unique</text><text x="98" y="49" fill="#5874ad" font-size="14" font-weight="700">Add fun frames and filters.</text>
    </g>
    <path d="M786 0v77" stroke="#b5d5f4"/>
    <g transform="translate(824)">
      <circle cx="35" cy="35" r="35" fill="#c7e1ff"/><path d="M35 15v29m-10-9 10 10 10-10M22 52v7h26v-7" fill="none" stroke="#072858" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="98" y="22" fill="#072858" font-size="16" font-weight="800">Get Your Photos</text><text x="98" y="49" fill="#5874ad" font-size="14" font-weight="700">Download instantly</text><text x="98" y="69" fill="#5874ad" font-size="14" font-weight="700">and keep your memories!</text>
    </g>
    <path d="M1175 0v77" stroke="#b5d5f4"/>
    <g transform="translate(1222 14)"><text x="0" y="8" fill="#5874ad" font-size="12">Developed by</text><text x="0" y="31" fill="#072858" font-size="18" font-weight="800">DevJomar</text><text x="0" y="49" fill="#5874ad" font-size="12">© 2026</text></g>
  </g>
</svg>
