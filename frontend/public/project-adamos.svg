<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Adamos Fresh Eggs project preview</title>
  <desc id="desc">A warm premium product mockup for the Adamos Fresh Eggs website.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#17122f"/><stop offset=".55" stop-color="#0b0b1c"/><stop offset="1" stop-color="#19102d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#66e4ff"/><stop offset="1" stop-color="#a66bff"/>
    </linearGradient>
    <radialGradient id="egg" cx="35%" cy="25%">
      <stop stop-color="#fff8d8"/><stop offset="1" stop-color="#decda2"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1180" cy="140" r="230" fill="#6937d3" opacity=".18" filter="url(#glow)"/>
  <circle cx="200" cy="760" r="280" fill="#28bed8" opacity=".09" filter="url(#glow)"/>
  <g fill="#fff" opacity=".25">
    <circle cx="95" cy="112" r="2"/><circle cx="328" cy="204" r="1.5"/><circle cx="840" cy="96" r="2"/><circle cx="1320" cy="420" r="1.5"/><circle cx="710" cy="780" r="2"/>
  </g>
  <g transform="translate(105 78)">
    <rect width="1230" height="744" rx="34" fill="#080816" stroke="#8150dc" stroke-opacity=".45"/>
    <rect x="1" y="1" width="1228" height="72" rx="33" fill="#100d25"/>
    <circle cx="38" cy="36" r="7" fill="#f07c9a"/><circle cx="62" cy="36" r="7" fill="#f5c36a"/><circle cx="86" cy="36" r="7" fill="#65d6b0"/>
    <text x="126" y="43" fill="#b4b0c7" font-family="Arial, sans-serif" font-size="18">adamos-fresh-eggs.com</text>
    <rect x="70" y="122" width="1090" height="548" rx="26" fill="#11101f" stroke="#6e5aa4" stroke-opacity=".25"/>
    <text x="125" y="178" fill="#ffffff" font-family="Arial, sans-serif" font-weight="700" font-size="28">ADAMOS</text>
    <text x="285" y="178" fill="#9b96ad" font-family="Arial, sans-serif" font-size="17">Fresh Eggs</text>
    <rect x="924" y="145" width="170" height="48" rx="24" fill="url(#accent)" opacity=".9"/>
    <text x="970" y="176" fill="#080815" font-family="Arial, sans-serif" font-weight="700" font-size="15">Order fresh</text>
    <text x="125" y="315" fill="#ffffff" font-family="Arial, sans-serif" font-weight="700" font-size="64">Farm fresh.</text>
    <text x="125" y="386" fill="url(#accent)" font-family="Arial, sans-serif" font-weight="700" font-size="64">Every morning.</text>
    <text x="125" y="448" fill="#9b97aa" font-family="Arial, sans-serif" font-size="21">A focused digital storefront for a local fresh-egg business.</text>
    <rect x="125" y="492" width="174" height="54" rx="27" fill="#7449db"/>
    <text x="172" y="526" fill="#fff" font-family="Arial, sans-serif" font-weight="700" font-size="16">Explore products</text>
    <g transform="translate(770 250)">
      <ellipse cx="105" cy="166" rx="82" ry="132" fill="url(#egg)" transform="rotate(-14 105 166)"/>
      <ellipse cx="230" cy="140" rx="82" ry="132" fill="url(#egg)" transform="rotate(10 230 140)"/>
      <ellipse cx="342" cy="190" rx="82" ry="132" fill="url(#egg)" transform="rotate(22 342 190)"/>
      <ellipse cx="226" cy="275" rx="82" ry="132" fill="#f4e9c7" transform="rotate(-4 226 275)"/>
